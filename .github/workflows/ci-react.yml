name: CI React

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:            # имя job — его отмечаем обязательным в защите ветки main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agromarket-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agromarket-react/package-lock.json
      - run: npm ci
      - run: npm test          # компонентные тесты (Vitest + Testing Library)
      - run: npm run build
