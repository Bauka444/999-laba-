name: CI Server

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:             # имя job — его отмечаем обязательным в защите ветки main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agromarket-server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agromarket_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agromarket_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      CORS_ORIGIN: http://localhost:5173
      ADMIN_EMAIL: admin@test.kz
      ADMIN_PASSWORD: AdminPass123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agromarket-server/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high   # уязвимости, попадающие на продакшен
      - run: npm test
